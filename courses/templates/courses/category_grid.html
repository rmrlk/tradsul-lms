<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categoria {{ category.name }} - Tradsul LMS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; }
        nav { background-color: #0f172a; color: #fff; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: #38bdf8; text-decoration: none; font-weight: 600; margin-left: 1rem; }
        .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
        .card { background: #fff; border-radius: 8px; padding: 1.25rem; border: 1px solid #e2e8f0; }
        .card-title { font-size: 1.1rem; font-weight: 600; color: #0f172a; margin-bottom: 0.5rem; }
        .btn { display: inline-block; margin-top: 1rem; padding: 0.5rem 1rem; background-color: #0284c7; color: #fff; border-radius: 4px; text-decoration: none; font-size: 0.85rem; font-weight: 600; }
    </style>
</head>
<body>
    <nav>
        <div style="font-size: 1.2rem; font-weight: bold;">📚 Tradsul LMS</div>
        <div>
            <a href="{% url 'student_dashboard' %}">Voltar para Cursos</a>
            <a href="{% url 'logout' %}" style="color: #ef4444;">Sair</a>
        </div>
    </nav>

    <div class="container">
        <h1 style="margin-bottom: 1.5rem; color: #0f172a;">Categoria: {{ category.name }}</h1>
        <div class="grid">
            {% for course in courses %}
                <div class="card">
                    <h3 class="card-title">{{ course.title }}</h3>
                    <p style="color: #64748b; font-size: 0.85rem;">{{ course.description }}</p>
                    <a href="{% url 'course_detail' course.id %}" class="btn">Ver Treinamento</a>
                </div>
            {% empty %}
                <p>Nenhum curso nesta categoria.</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
