<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tradsul LMS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background-color: #1e293b; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 400px; border: 1px solid #334155; }
        .brand { text-align: center; margin-bottom: 2rem; }
        .brand h1 { font-size: 1.8rem; font-weight: 700; color: #38bdf8; letter-spacing: 1px; }
        .brand p { color: #94a3b8; font-size: 0.9rem; margin-top: 0.25rem; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.5rem; font-size: 0.85rem; color: #cbd5e1; }
        input { width: 100%; padding: 0.75rem; background-color: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 0.95rem; outline: none; }
        input:focus { border-color: #38bdf8; }
        .btn-submit { width: 100%; padding: 0.85rem; background-color: #0284c7; color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 1rem; }
        .btn-submit:hover { background-color: #0369a1; }
        .messages { margin-bottom: 1rem; color: #ef4444; font-size: 0.85rem; text-align: center; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">
            <h1>TRADSUL LMS</h1>
            <p>Portal Corporativo de Treinamentos</p>
        </div>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>E-mail Corporativo</label>
                <input type="email" name="email" placeholder="nome@tradsul.com.br" required>
            </div>
            <div class="form-group">
                <label>Sua Senha</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Entrar na Plataforma</button>
        </form>
    </div>
</body>
</html>
